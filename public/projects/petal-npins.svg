<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500">
  <defs>
    <!-- Card Surface Gradient -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222330"/>
      <stop offset="100%" stop-color="#181822"/>
    </linearGradient>

    <!-- Visual Area Viewport Gradient -->
    <linearGradient id="visualBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281a17"/>
      <stop offset="60%" stop-color="#1e1310"/>
      <stop offset="100%" stop-color="#140d0a"/>
    </linearGradient>

    <!-- Ambient Rose Glow -->
    <radialGradient id="petalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8956D" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#C2410C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C2410C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── 1. Base Card Surface ── -->
  <rect width="750" height="500" rx="16" fill="url(#cardSurface)"/>
  <rect width="750" height="500" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5"/>

  <!-- ── 2. Upper Project Visual Area (~68% of card height) ── -->
  <g transform="translate(20, 20)">
    <!-- Visual Canvas Background -->
    <rect width="710" height="315" rx="10" fill="url(#visualBg)"/>
    <rect width="710" height="315" rx="10" fill="url(#petalGlow)"/>
    <rect width="710" height="315" rx="10" fill="none" stroke="rgba(232, 149, 109, 0.22)" stroke-width="1"/>

    <!-- Subtle Boutique Grid -->
    <g stroke="rgba(232, 149, 109, 0.07)" stroke-width="1">
      <line x1="0" y1="80" x2="710" y2="80"/>
      <line x1="0" y1="160" x2="710" y2="160"/>
      <line x1="0" y1="240" x2="710" y2="240"/>
      <line x1="236" y1="0" x2="236" y2="315"/>
      <line x1="472" y1="0" x2="472" y2="315"/>
    </g>

    <!-- Visual Graphic: Luxury Boutique Product Cards & Checkout Flow -->
    <g transform="translate(60, 50)">
      <!-- Product Showcase Card 1 -->
      <g transform="translate(0, 15)">
        <rect width="165" height="185" rx="8" fill="rgba(30, 20, 18, 0.75)" stroke="rgba(232, 149, 109, 0.35)" stroke-width="1.2"/>
        <rect x="15" y="15" width="135" height="95" rx="5" fill="rgba(232, 149, 109, 0.15)"/>
        <!-- Minimal Product Silhouette -->
        <circle cx="82" cy="55" r="24" fill="rgba(232, 149, 109, 0.3)"/>
        <path d="M 68 85 C 68 70, 96 70, 96 85 Z" fill="rgba(232, 149, 109, 0.4)"/>
        <text x="18" y="130" font-family="'Syne', sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">Botanical Brooch</text>
        <text x="18" y="148" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E8956D">₹ 1,850</text>
        <rect x="18" y="158" width="60" height="14" rx="2" fill="rgba(232, 149, 109, 0.25)"/>
        <text x="48" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FDBA74">IN STOCK</text>
      </g>

      <!-- Center Flow Arrow -->
      <g transform="translate(195, 107)">
        <line x1="0" y1="0" x2="25" y2="0" stroke="#E8956D" stroke-width="1.8" stroke-dasharray="3 3"/>
        <circle cx="12" cy="0" r="3.5" fill="#E8956D"/>
      </g>

      <!-- Product Showcase Card 2 (Featured Collection) -->
      <g transform="translate(235, 15)">
        <rect width="165" height="185" rx="8" fill="rgba(30, 20, 18, 0.75)" stroke="rgba(232, 149, 109, 0.35)" stroke-width="1.2"/>
        <rect x="15" y="15" width="135" height="95" rx="5" fill="rgba(232, 149, 109, 0.15)"/>
        <!-- Minimal Product Silhouette -->
        <ellipse cx="82" cy="60" rx="30" ry="18" fill="rgba(232, 149, 109, 0.35)"/>
        <text x="18" y="130" font-family="'Syne', sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">Silk Blossom Pin</text>
        <text x="18" y="148" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E8956D">₹ 2,400</text>
        <rect x="18" y="158" width="60" height="14" rx="2" fill="rgba(232, 149, 109, 0.25)"/>
        <text x="48" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FDBA74">FEATURED</text>
      </g>

      <!-- Center Flow Arrow -->
      <g transform="translate(430, 107)">
        <line x1="0" y1="0" x2="25" y2="0" stroke="#E8956D" stroke-width="1.8" stroke-dasharray="3 3"/>
        <circle cx="12" cy="0" r="3.5" fill="#E8956D"/>
      </g>

      <!-- Secure Checkout & Webhook Block -->
      <g transform="translate(470, 15)">
        <rect width="135" height="185" rx="8" fill="rgba(30, 20, 18, 0.75)" stroke="rgba(232, 149, 109, 0.45)" stroke-width="1.2"/>
        <rect x="12" y="15" width="111" height="30" rx="4" fill="rgba(232, 149, 109, 0.2)"/>
        <text x="67" y="34" text-anchor="middle" font-family="'Syne', sans-serif" font-size="11" font-weight="700" fill="#FDBA74">RAZORPAY</text>

        <g transform="translate(16, 60)">
          <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="rgba(255,255,255,0.7)">Signature QA</text>
          <text x="0" y="26" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10B981">✓ VERIFIED</text>
          <line x1="0" y1="36" x2="103" y2="36" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="rgba(255,255,255,0.7)">Webhook Latency</text>
          <text x="0" y="66" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FDBA74">48ms TTL</text>
          <line x1="0" y1="76" x2="103" y2="76" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          <rect x="0" y="86" width="103" height="22" rx="3" fill="#10B981"/>
          <text x="51" y="100" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10" font-weight="700" fill="#064E3B">PAID ORDER</text>
        </g>
      </g>
    </g>

    <!-- Header Status Badges -->
    <g transform="translate(24, 24)">
      <rect width="138" height="22" rx="4" fill="rgba(28, 16, 13, 0.8)" stroke="rgba(232, 149, 109, 0.35)" stroke-width="1"/>
      <circle cx="12" cy="11" r="3" fill="#10B981"/>
      <text x="22" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFEDD5" letter-spacing="1">LIVE PRODUCTION</text>
    </g>

    <g transform="translate(565, 24)">
      <rect width="120" height="22" rx="4" fill="rgba(28, 16, 13, 0.8)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="60" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255, 255, 255, 0.6)" letter-spacing="1">HONO / TRPC</text>
    </g>
  </g>

  <!-- ── 3. Lower Card Typography (~32% of card height) ── -->
  <line x1="24" y1="352" x2="726" y2="352" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>

  <g transform="translate(32, 375)">
    <!-- Category Tag -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="5" r="3" fill="#E8956D"/>
      <text x="14" y="9" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#E8956D" letter-spacing="2">E-COMMERCE PLATFORM · LIVE</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="44" font-family="'Syne', system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">PETAL N PINS</text>

    <!-- One-line Descriptor -->
    <text x="0" y="74" font-family="'DM Sans', system-ui, sans-serif" font-size="15" fill="rgba(255, 255, 255, 0.62)">Live full-stack boutique e-commerce platform with sub-100ms response</text>

    <!-- External Link Glyph -->
    <g transform="translate(650, 28)">
      <circle cx="16" cy="16" r="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="16" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">↗</text>
    </g>
  </g>
</svg>
