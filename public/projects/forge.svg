    <text x="26" y="68" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF">agent.ts</text>
    <text x="26" y="88" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.6)">sandbox.rs</text>
    <text x="26" y="108" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.6)">ipc_bus.go</text>
