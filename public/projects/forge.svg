<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500">
  <defs>
    <!-- Card Surface Gradient -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222330"/>
      <stop offset="100%" stop-color="#181822"/>
    </linearGradient>

    <!-- Visual Area Viewport Gradient -->
    <linearGradient id="visualBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102422"/>
      <stop offset="60%" stop-color="#0c1c1b"/>
      <stop offset="100%" stop-color="#081413"/>
    </linearGradient>

    <!-- Ambient Teal Glow -->
    <radialGradient id="forgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0F766E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── 1. Base Card Surface ── -->
  <rect width="750" height="500" rx="16" fill="url(#cardSurface)"/>
  <rect width="750" height="500" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5"/>

  <!-- ── 2. Upper Project Visual Area (~68% of card height) ── -->
  <g transform="translate(20, 20)">
    <!-- Visual Canvas Background -->
    <rect width="710" height="315" rx="10" fill="url(#visualBg)"/>
    <rect width="710" height="315" rx="10" fill="url(#forgeGlow)"/>
    <rect width="710" height="315" rx="10" fill="none" stroke="rgba(45, 212, 191, 0.22)" stroke-width="1"/>

    <!-- Subtle Dev Grid Lines -->
    <g stroke="rgba(45, 212, 191, 0.07)" stroke-width="1">
      <line x1="0" y1="80" x2="710" y2="80"/>
      <line x1="0" y1="160" x2="710" y2="160"/>
      <line x1="0" y1="240" x2="710" y2="240"/>
      <line x1="230" y1="0" x2="230" y2="315"/>
      <line x1="470" y1="0" x2="470" y2="315"/>
    </g>

    <!-- Visual Graphic: Local-First IDE Architecture Split-Pane & IPC Sandbox -->
    <g transform="translate(55, 55)">
      <!-- Left Pane: Code AST Structure -->
      <rect x="0" y="20" width="280" height="175" rx="6" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(45, 212, 191, 0.35)" stroke-width="1.2"/>
      <!-- Editor Header -->
      <rect x="0" y="20" width="280" height="28" rx="6" fill="rgba(45, 212, 191, 0.12)"/>
      <circle cx="16" cy="34" r="3.5" fill="#EF4444" opacity="0.8"/>
      <circle cx="28" cy="34" r="3.5" fill="#F59E0B" opacity="0.8"/>
      <circle cx="40" cy="34" r="3.5" fill="#10B981" opacity="0.8"/>
      <text x="60" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5EEAD4">kernel/agent_runtime.ts</text>

      <!-- Code Structure Lines -->
      <g transform="translate(18, 66)">
        <rect x="0" y="0" width="60" height="6" rx="2" fill="#2DD4BF" opacity="0.8"/>
        <rect x="70" y="0" width="90" height="6" rx="2" fill="rgba(255,255,255,0.4)"/>
        <rect x="18" y="16" width="110" height="6" rx="2" fill="rgba(255,255,255,0.65)"/>
        <rect x="18" y="32" width="75" height="6" rx="2" fill="#5EEAD4" opacity="0.9"/>
        <rect x="100" y="32" width="55" height="6" rx="2" fill="rgba(255,255,255,0.4)"/>
        <rect x="36" y="48" width="140" height="6" rx="2" fill="rgba(255,255,255,0.5)"/>
        <rect x="36" y="64" width="80" height="6" rx="2" fill="#2DD4BF" opacity="0.7"/>
        <rect x="18" y="80" width="45" height="6" rx="2" fill="rgba(255,255,255,0.4)"/>
        <rect x="0" y="96" width="30" height="6" rx="2" fill="#2DD4BF" opacity="0.8"/>
      </g>

      <!-- Middle Connecting IPC Pipe -->
      <g transform="translate(280, 107)">
        <line x1="0" y1="0" x2="40" y2="0" stroke="#2DD4BF" stroke-width="1.8" stroke-dasharray="3 3"/>
        <circle cx="20" cy="0" r="4.5" fill="#2DD4BF"/>
      </g>

      <!-- Right Pane: Hardened IPC Execution Sandbox -->
      <rect x="320" y="20" width="280" height="175" rx="6" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(45, 212, 191, 0.35)" stroke-width="1.2"/>
      <rect x="320" y="20" width="280" height="28" rx="6" fill="rgba(45, 212, 191, 0.12)"/>
      <text x="338" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5EEAD4">HARDENED SANDBOX</text>
      <rect x="525" y="27" width="60" height="14" rx="2" fill="rgba(45, 212, 191, 0.25)"/>
      <text x="555" y="37" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#5EEAD4">ISOLATED</text>

      <!-- Terminal Output Lines -->
      <g transform="translate(338, 68)">
        <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#2DD4BF">$ forge run --local-model</text>
        <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.5)">[ipc] child process 8402 bound</text>
        <text x="0" y="46" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.5)">[ast] parsing syntax tree (14ms)</text>
        <text x="0" y="64" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">✓ memory isolation active</text>
        <text x="0" y="82" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.5)">[pty] listening on unix socket</text>
      </g>
    </g>

    <!-- Header Status Badges -->
    <g transform="translate(24, 24)">
      <rect width="138" height="22" rx="4" fill="rgba(11, 24, 22, 0.8)" stroke="rgba(45, 212, 191, 0.35)" stroke-width="1"/>
      <circle cx="12" cy="11" r="3" fill="#2DD4BF"/>
      <text x="22" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#CCFBF1" letter-spacing="1">LOCAL-FIRST OS</text>
    </g>

    <g transform="translate(565, 24)">
      <rect width="120" height="22" rx="4" fill="rgba(11, 24, 22, 0.8)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="60" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255, 255, 255, 0.6)" letter-spacing="1">ELECTRON / PTY</text>
    </g>
  </g>

  <!-- ── 3. Lower Card Typography (~32% of card height) ── -->
  <line x1="24" y1="352" x2="726" y2="352" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>

  <g transform="translate(32, 375)">
    <!-- Category Tag -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="5" r="3" fill="#2DD4BF"/>
      <text x="14" y="9" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#2DD4BF" letter-spacing="2">DEVELOPER PLATFORM · 2026</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="44" font-family="'Syne', system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">FORGE IDE</text>

    <!-- One-line Descriptor -->
    <text x="0" y="74" font-family="'DM Sans', system-ui, sans-serif" font-size="15" fill="rgba(255, 255, 255, 0.62)">Local-first desktop AI software engineering platform with hardened IPC</text>

    <!-- External Link Glyph -->
    <g transform="translate(650, 28)">
      <circle cx="16" cy="16" r="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="16" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">↗</text>
    </g>
  </g>
</svg>
