    <rect x="155" width="515" height="240" fill="rgba(4, 18, 16, 0.6)" rx="6" stroke="rgba(45, 212, 191, 0.25)" stroke-width="1"/>
    <g transform="translate(175, 30)" font-family="'JetBrains Mono', monospace" font-size="12">
      <text y="0"><tspan fill="#F472B6">import</tspan> { <tspan fill="#38BDF8">AgentRuntime</tspan> } <tspan fill="#F472B6">from</tspan> <tspan fill="#34D399">'@forge/core'</tspan>;</text>
      <text y="24"><tspan fill="#F472B6">export class</tspan> <tspan fill="#5EEAD4">ForgeEngine</tspan> <tspan fill="#F472B6">implements</tspan> <tspan fill="#38BDF8">Sandbox</tspan> {</text>
      <text y="48">  <tspan fill="#F472B6">private</tspan> <tspan fill="#FFFFFF">workerPool</tspan>: <tspan fill="#38BDF8">WorkerCluster</tspan>;</text>
      <text y="72">  <tspan fill="#F472B6">async</tspan> <tspan fill="#38BDF8">dispatchTask</tspan>(<tspan fill="#FFFFFF">prompt</tspan>: <tspan fill="#38BDF8">TaskIntent</tspan>) {</text>
      <text y="96">    <tspan fill="#F472B6">return await</tspan> <tspan fill="#F59E0B">this</tspan>.workerPool.<tspan fill="#38BDF8">execDeterministic</tspan>();</text>
      <text y="120">  }</text>
      <text y="144">}</text>
      <text y="175" fill="rgba(45, 212, 191, 0.8)">// ✓ Hardened IPC Sandbox Verified (0ms cloud latency)</text>
    </g>
  </g>

