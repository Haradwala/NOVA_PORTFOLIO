<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500">
  <defs>
    <!-- Card Surface Gradient -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222330"/>
      <stop offset="100%" stop-color="#181822"/>
    </linearGradient>

    <!-- Visual Area Viewport Gradient -->
    <linearGradient id="visualBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1832"/>
      <stop offset="60%" stop-color="#151224"/>
      <stop offset="100%" stop-color="#110f1c"/>
    </linearGradient>

    <!-- Ambient Lavender Glow -->
    <radialGradient id="desktopGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── 1. Base Card Surface ── -->
  <rect width="750" height="500" rx="16" fill="url(#cardSurface)"/>
  <rect width="750" height="500" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5"/>

  <!-- ── 2. Upper Project Visual Area (~68% of card height) ── -->
  <g transform="translate(20, 20)">
    <!-- Visual Canvas Background -->
    <rect width="710" height="315" rx="10" fill="url(#visualBg)"/>
    <rect width="710" height="315" rx="10" fill="url(#desktopGlow)"/>
    <rect width="710" height="315" rx="10" fill="none" stroke="rgba(167, 139, 250, 0.22)" stroke-width="1"/>

    <!-- Subtle Scan Grid Lines -->
    <g stroke="rgba(167, 139, 250, 0.07)" stroke-width="1">
      <line x1="0" y1="80" x2="710" y2="80"/>
      <line x1="0" y1="160" x2="710" y2="160"/>
      <line x1="0" y1="240" x2="710" y2="240"/>
      <line x1="180" y1="0" x2="180" y2="315"/>
      <line x1="355" y1="0" x2="355" y2="315"/>
      <line x1="530" y1="0" x2="530" y2="315"/>
    </g>

    <!-- Visual Graphic: Desktop Viewport Frame & Computer Vision OCR Engine -->
    <g transform="translate(55, 45)">
      <!-- Main Desktop Frame -->
      <rect x="0" y="20" width="380" height="195" rx="7" fill="rgba(18, 14, 30, 0.75)" stroke="rgba(167, 139, 250, 0.45)" stroke-width="1.2"/>
      <!-- Window Titlebar -->
      <rect x="0" y="20" width="380" height="26" rx="7" fill="rgba(167, 139, 250, 0.15)"/>
      <circle cx="16" cy="33" r="3.5" fill="#EF4444" opacity="0.8"/>
      <circle cx="28" cy="33" r="3.5" fill="#F59E0B" opacity="0.8"/>
      <circle cx="40" cy="33" r="3.5" fill="#10B981" opacity="0.8"/>
      <text x="60" y="37" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#DDD6FE">screen_capture_ocr.py</text>

      <!-- Vision OCR Bounding Box 1 -->
      <rect x="25" y="65" width="165" height="42" rx="3" fill="rgba(167, 139, 250, 0.12)" stroke="#A78BFA" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="35" y="85" font-family="'JetBrains Mono', monospace" font-size="11" fill="#EDE9FE">f(x) = ∫ 2x dx = x²</text>
      <rect x="155" y="60" width="40" height="13" rx="2" fill="#8B5CF6"/>
      <text x="175" y="70" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#FFFFFF">MATH</text>

      <!-- Vision OCR Bounding Box 2 -->
      <rect x="25" y="120" width="220" height="35" rx="3" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="35" y="142" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E0F2FE">Text block recognized</text>
      <rect x="210" y="115" width="40" height="13" rx="2" fill="#0284C7"/>
      <text x="230" y="125" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#FFFFFF">99.4%</text>

      <!-- Laser Scan Vector -->
      <line x1="25" y1="172" x2="355" y2="172" stroke="#38BDF8" stroke-width="1.8"/>
      <circle cx="190" cy="172" r="4" fill="#38BDF8"/>
      <circle cx="190" cy="172" r="8" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.6"/>

      <!-- Connecting Processing Pipeline to Automation Engine -->
      <g transform="translate(380, 117)">
        <line x1="0" y1="0" x2="35" y2="0" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="3 3"/>
        <circle cx="17" cy="0" r="4" fill="#A78BFA"/>
      </g>

      <!-- Right Panel: Automation & Solver Status -->
      <g transform="translate(415, 20)">
        <rect width="185" height="195" rx="7" fill="rgba(18, 14, 30, 0.75)" stroke="rgba(167, 139, 250, 0.45)" stroke-width="1.2"/>
        <rect width="185" height="26" rx="7" fill="rgba(167, 139, 250, 0.15)"/>
        <text x="92" y="17" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10.5" font-weight="700" fill="#DDD6FE">AUTOMATION CORE</text>

        <g transform="translate(16, 45)">
          <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">Engine: PyQt5</text>
          <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">CV: OpenCV 4.8</text>
          <text x="0" y="50" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">OCR: Tesseract</text>
          <text x="0" y="68" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">PyAutoGUI: Ready</text>
          <line x1="0" y1="80" x2="153" y2="80" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          <rect x="0" y="94" width="153" height="24" rx="4" fill="#8B5CF6"/>
          <text x="76" y="110" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">SOLVER ACTIVE</text>
        </g>
      </g>
    </g>

    <!-- Header Status Badges -->
    <g transform="translate(24, 24)">
      <rect width="138" height="22" rx="4" fill="rgba(22, 16, 35, 0.8)" stroke="rgba(167, 139, 250, 0.35)" stroke-width="1"/>
      <circle cx="12" cy="11" r="3" fill="#A78BFA"/>
      <text x="22" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#EDE9FE" letter-spacing="1">VISION PIPELINE</text>
    </g>

    <g transform="translate(565, 24)">
      <rect width="120" height="22" rx="4" fill="rgba(22, 16, 35, 0.8)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="60" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255, 255, 255, 0.6)" letter-spacing="1">PYTHON / OPENCV</text>
    </g>
  </g>

  <!-- ── 3. Lower Card Typography (~32% of card height) ── -->
  <line x1="24" y1="352" x2="726" y2="352" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>

  <g transform="translate(32, 375)">
    <!-- Category Tag -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="5" r="3" fill="#A78BFA"/>
      <text x="14" y="9" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#A78BFA" letter-spacing="2">DESKTOP AUTOMATION · 2024–2025</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="44" font-family="'Syne', system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">NOVA DESKTOP</text>

    <!-- One-line Descriptor -->
    <text x="0" y="74" font-family="'DM Sans', system-ui, sans-serif" font-size="15" fill="rgba(255, 255, 255, 0.62)">Desktop automation assistant automating workflows with screen OCR and problem solving</text>

    <!-- External Link Glyph -->
    <g transform="translate(650, 28)">
      <circle cx="16" cy="16" r="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="16" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">↗</text>
    </g>
  </g>
</svg>
