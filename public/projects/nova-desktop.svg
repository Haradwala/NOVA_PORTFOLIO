<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500">
  <defs>
    <linearGradient id="ndBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191130"/>
      <stop offset="50%" stop-color="#0e091c"/>
      <stop offset="100%" stop-color="#04020a"/>
    </linearGradient>
    <radialGradient id="ndGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0e091c" stop-opacity="0"/>
    </radialGradient>
    <filter id="ndBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="750" height="500" fill="url(#ndBg)" rx="16"/>
  <rect x="150" y="80" width="450" height="300" fill="#7C3AED" opacity="0.3" filter="url(#ndBlur)"/>
  <rect width="750" height="500" fill="url(#ndGlow)" rx="16"/>

  <!-- Outer Rim Highlight -->
  <rect x="2" y="2" width="746" height="496" fill="none" stroke="rgba(167, 139, 250, 0.45)" stroke-width="2" rx="15"/>
  <rect x="6" y="6" width="738" height="488" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="12"/>

  <!-- Window Header Bar -->
  <rect x="16" y="16" width="718" height="38" fill="rgba(255, 255, 255, 0.04)" rx="8"/>
  <circle cx="36" cy="35" r="5" fill="#EF4444"/>
  <circle cx="52" cy="35" r="5" fill="#F59E0B"/>
  <circle cx="68" cy="35" r="5" fill="#10B981"/>
  <text x="92" y="39" font-family="'JetBrains Mono', monospace" font-size="12" fill="rgba(255, 255, 255, 0.6)" letter-spacing="1">nova-assistant // vision_ocr_pipeline.py</text>
  <rect x="580" y="26" width="140" height="18" fill="rgba(167, 139, 250, 0.25)" rx="4"/>
  <text x="650" y="39" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#C4B5FD" text-anchor="middle" letter-spacing="1">VISION ENGINE</text>

  <!-- Desktop Assistant Interface Mockup -->
  <g transform="translate(45, 75)">
    <!-- OCR Vision Target Frame -->
    <rect width="380" height="230" fill="rgba(20, 12, 40, 0.6)" rx="8" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1"/>
    <!-- Screen text simulation -->
    <text x="24" y="45" font-family="'JetBrains Mono', monospace" font-size="13" fill="#FFFFFF">Optical Screen Capture Target</text>
    <rect x="24" y="65" width="330" height="85" fill="rgba(0, 0, 0, 0.35)" rx="6" stroke="rgba(167, 139, 250, 0.2)" stroke-width="1"/>
    <!-- Bounding boxes -->
    <rect x="34" y="75" width="140" height="30" fill="rgba(139, 92, 246, 0.15)" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="3 2" rx="2"/>
    <text x="42" y="95" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38BDF8">∫ e^(-x²) dx</text>
    <rect x="34" y="112" width="140" height="25" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5" rx="2"/>
    <text x="42" y="128" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34D399">= √π / 2  [SOLVED]</text>
    <!-- Crosshairs -->
    <circle cx="280" cy="105" r="28" fill="none" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="280" y1="70" x2="280" y2="140" stroke="#C4B5FD" stroke-width="1.5"/>
    <line x1="245" y1="105" x2="315" y2="105" stroke="#C4B5FD" stroke-width="1.5"/>
    <circle cx="280" cy="105" r="4" fill="#A78BFA"/>
    <text x="24" y="185" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A78BFA">OCR CONFIDENCE: 99.4% · TESSERACT + OPENCV</text>

    <!-- Side Tools Panel -->
    <g transform="translate(400, 0)">
      <rect width="260" height="230" fill="rgba(20, 12, 40, 0.6)" rx="8" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1"/>
      <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#C4B5FD">AUTOMATION MODULES</text>
      <rect x="20" y="48" width="220" height="35" fill="rgba(167, 139, 250, 0.15)" rx="6"/>
      <text x="32" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF">Global Hotkey Listener</text>
      <rect x="20" y="92" width="220" height="35" fill="rgba(167, 139, 250, 0.15)" rx="6"/>
      <text x="32" y="114" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF">Screen OCR Bounding</text>
      <rect x="20" y="136" width="220" height="35" fill="rgba(167, 139, 250, 0.15)" rx="6"/>
      <text x="32" y="158" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF">Symbolic Math Solver</text>
      <rect x="20" y="180" width="220" height="35" fill="rgba(167, 139, 250, 0.15)" rx="6"/>
      <text x="32" y="202" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF">System Automation IPC</text>
    </g>
  </g>

  <!-- Project Caption Footer -->
  <rect x="0" y="420" width="750" height="80" fill="rgba(4, 2, 10, 0.9)"/>
  <line x1="0" y1="420" x2="750" y2="420" stroke="rgba(167, 139, 250, 0.25)" stroke-width="1"/>
  <text x="40" y="462" font-family="'Syne', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">NOVA DESKTOP</text>
  <text x="40" y="484" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#C4B5FD" letter-spacing="1.5">DESKTOP AUTOMATION &amp; VISION · 2024–2025</text>
  <text x="710" y="468" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="end" letter-spacing="1">EXPLORE ↗</text>
</svg>
