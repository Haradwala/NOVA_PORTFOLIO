<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500">
  <defs>
    <!-- Card Surface Gradient -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222330"/>
      <stop offset="100%" stop-color="#181822"/>
    </linearGradient>

    <!-- Visual Area Viewport Gradient -->
    <linearGradient id="visualBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e2e"/>
      <stop offset="60%" stop-color="#101724"/>
      <stop offset="100%" stop-color="#0c111c"/>
    </linearGradient>

    <!-- Ambient Sky Glow -->
    <radialGradient id="financeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Ledger Block Gradient -->
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- ── 1. Base Card Surface ── -->
  <rect width="750" height="500" rx="16" fill="url(#cardSurface)"/>
  <rect width="750" height="500" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5"/>

  <!-- ── 2. Upper Project Visual Area (~68% of card height) ── -->
  <g transform="translate(20, 20)">
    <!-- Visual Canvas Background -->
    <rect width="710" height="315" rx="10" fill="url(#visualBg)"/>
    <rect width="710" height="315" rx="10" fill="url(#financeGlow)"/>
    <rect width="710" height="315" rx="10" fill="none" stroke="rgba(56, 189, 248, 0.22)" stroke-width="1"/>

    <!-- Subtle Ledger Grid Lines -->
    <g stroke="rgba(56, 189, 248, 0.07)" stroke-width="1">
      <line x1="0" y1="80" x2="710" y2="80"/>
      <line x1="0" y1="160" x2="710" y2="160"/>
      <line x1="0" y1="240" x2="710" y2="240"/>
      <line x1="180" y1="0" x2="180" y2="315"/>
      <line x1="355" y1="0" x2="355" y2="315"/>
      <line x1="530" y1="0" x2="530" y2="315"/>
    </g>

    <!-- Visual Graphic: Double-Entry Immutable Ledger Architecture -->
    <g transform="translate(65, 55)">
      <!-- Left Column: Assets Ledger Block -->
      <rect x="0" y="30" width="165" height="150" rx="8" fill="url(#blockGrad)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2"/>
      <text x="20" y="62" font-family="'Syne', sans-serif" font-size="14" font-weight="700" fill="#38BDF8">ASSETS CORE</text>
      <line x1="20" y1="74" x2="145" y2="74" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
      <text x="20" y="98" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.7)">+ Cash &amp; Bank</text>
      <text x="20" y="120" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.7)">+ Receivables</text>
      <text x="20" y="142" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.7)">+ Vault Equity</text>
      <rect x="20" y="154" width="70" height="16" rx="3" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="26" y="166" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7DD3FC">DEBIT BAL</text>

      <!-- Center Consensus Balancing Invariant Hub -->
      <g transform="translate(290, 105)">
        <circle r="46" fill="rgba(14, 165, 233, 0.15)" stroke="#38BDF8" stroke-width="1.5"/>
        <circle r="34" fill="none" stroke="#7DD3FC" stroke-width="1" stroke-dasharray="4 4"/>
        <text x="0" y="-8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38BDF8">Σ Δ = 0</text>
        <text x="0" y="10" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#E0F2FE">INVARIANT</text>
        <text x="0" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="rgba(255,255,255,0.5)">ACID LOCK</text>
      </g>

      <!-- Connecting Balance Vectors -->
      <path d="M 165 105 L 244 105" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="4 4"/>
      <circle cx="205" cy="105" r="4" fill="#38BDF8"/>
      <path d="M 336 105 L 415 105" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="4 4"/>
      <circle cx="375" cy="105" r="4" fill="#38BDF8"/>

      <!-- Right Column: Liabilities & Equity Ledger Block -->
      <rect x="415" y="30" width="165" height="150" rx="8" fill="url(#blockGrad)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2"/>
      <text x="435" y="62" font-family="'Syne', sans-serif" font-size="14" font-weight="700" fill="#38BDF8">LIABILITIES</text>
      <line x1="435" y1="74" x2="560" y2="74" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
      <text x="435" y="98" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.7)">- Payables</text>
      <text x="435" y="120" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.7)">- Shared Capital</text>
      <text x="435" y="142" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.7)">- Retained Ops</text>
      <rect x="435" y="154" width="70" height="16" rx="3" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="441" y="166" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7DD3FC">CREDIT BAL</text>
    </g>

    <!-- Header Status Badges -->
    <g transform="translate(24, 24)">
      <rect width="138" height="22" rx="4" fill="rgba(12, 17, 28, 0.75)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
      <circle cx="12" cy="11" r="3" fill="#38BDF8"/>
      <text x="22" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#BAE6FD" letter-spacing="1">DECIMAL128 ENGINE</text>
    </g>

    <g transform="translate(565, 24)">
      <rect width="120" height="22" rx="4" fill="rgba(12, 17, 28, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="60" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255, 255, 255, 0.6)" letter-spacing="1">FASTAPI / MOTOR</text>
    </g>
  </g>

  <!-- ── 3. Lower Card Typography (~32% of card height) ── -->
  <line x1="24" y1="352" x2="726" y2="352" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>

  <g transform="translate(32, 375)">
    <!-- Category Tag -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="5" r="3" fill="#38BDF8"/>
      <text x="14" y="9" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#38BDF8" letter-spacing="2">LEDGER &amp; ACCOUNTING · 2026</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="44" font-family="'Syne', system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">FINANCE MANAGER</text>

    <!-- One-line Descriptor -->
    <text x="0" y="74" font-family="'DM Sans', system-ui, sans-serif" font-size="15" fill="rgba(255, 255, 255, 0.62)">High-precision accounting engine &amp; ledger core with strict balance invariants</text>

    <!-- External Link Glyph -->
    <g transform="translate(650, 28)">
      <circle cx="16" cy="16" r="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="16" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">↗</text>
    </g>
  </g>
</svg>
