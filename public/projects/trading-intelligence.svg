    <circle cx="115" cy="-50" r="6" fill="#FCD34D"/>
    <!-- Candlestick indicators -->
    <line x1="-30" y1="-40" x2="-30" y2="-10" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="-34" y="-32" width="8" height="15" fill="#F59E0B" rx="1"/>
    <line x1="50" y1="-50" x2="50" y2="-20" stroke="#FCD34D" stroke-width="1.5"/>
