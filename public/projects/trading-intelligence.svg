<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500">
  <defs>
    <linearGradient id="trBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241405"/>
      <stop offset="50%" stop-color="#120a02"/>
      <stop offset="100%" stop-color="#050301"/>
    </linearGradient>
    <radialGradient id="trGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#120a02" stop-opacity="0"/>
    </radialGradient>
    <filter id="trBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="750" height="500" fill="url(#trBg)" rx="16"/>
  <rect x="150" y="80" width="450" height="300" fill="#D97706" opacity="0.3" filter="url(#trBlur)"/>
  <rect width="750" height="500" fill="url(#trGlow)" rx="16"/>

  <!-- Outer Rim Highlight -->
  <rect x="2" y="2" width="746" height="496" fill="none" stroke="rgba(245, 158, 11, 0.45)" stroke-width="2" rx="15"/>
  <rect x="6" y="6" width="738" height="488" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="12"/>

  <!-- Window Header Bar -->
  <rect x="16" y="16" width="718" height="38" fill="rgba(255, 255, 255, 0.04)" rx="8"/>
  <circle cx="36" cy="35" r="5" fill="#EF4444"/>
  <circle cx="52" cy="35" r="5" fill="#F59E0B"/>
  <circle cx="68" cy="35" r="5" fill="#10B981"/>
  <text x="92" y="39" font-family="'JetBrains Mono', monospace" font-size="12" fill="rgba(255, 255, 255, 0.6)" letter-spacing="1">trading-engine // ccxt-async-regime.py</text>
  <rect x="590" y="26" width="130" height="18" fill="rgba(245, 158, 11, 0.25)" rx="4"/>
  <text x="655" y="39" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FCD34D" text-anchor="middle" letter-spacing="1">REGIME: BREAKOUT</text>

  <!-- Center Artwork: Market Series Chart & Candlesticks -->
  <g transform="translate(100, 100)">
    <!-- Grid lines -->
    <line x1="0" y1="50" x2="550" y2="50" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="0" y1="110" x2="550" y2="110" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="0" y1="170" x2="550" y2="170" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Candlestick cluster -->
    <line x1="80" y1="130" x2="80" y2="180" stroke="#10B981" stroke-width="1.5"/>
    <rect x="74" y="140" width="12" height="30" fill="#10B981" rx="1"/>

    <line x1="130" y1="110" x2="130" y2="170" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="124" y="120" width="12" height="35" fill="#EF4444" rx="1"/>

    <line x1="180" y1="80" x2="180" y2="150" stroke="#10B981" stroke-width="1.5"/>
    <rect x="174" y="90" width="12" height="40" fill="#10B981" rx="1"/>

    <line x1="230" y1="60" x2="230" y2="130" stroke="#10B981" stroke-width="1.5"/>
    <rect x="224" y="70" width="12" height="45" fill="#10B981" rx="1"/>

    <line x1="280" y1="40" x2="280" y2="110" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="274" y="50" width="12" height="30" fill="#EF4444" rx="1"/>

    <!-- Moving Average / Quantitative Curve -->
    <path d="M0 160 Q100 140 200 90 T400 40 T550 20" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="550" cy="20" r="6" fill="#FCD34D"/>
  </g>

  <!-- Metrics Cards -->
  <g transform="translate(40, 320)">
    <rect width="210" height="75" fill="rgba(36, 20, 5, 0.7)" rx="8" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FCD34D">EXECUTION SLIPPAGE</text>
    <text x="16" y="48" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#FFFFFF">&lt; 0.02 BPS</text>
    <text x="16" y="66" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399">TICK-TO-TRADE: 0.8ms</text>
  </g>
  <g transform="translate(500, 320)">
    <rect width="210" height="75" fill="rgba(36, 20, 5, 0.7)" rx="8" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FCD34D">RISK BOUNDING</text>
    <text x="16" y="48" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#FFFFFF">ACTIVE VaR</text>
    <text x="16" y="66" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F59E0B">CCXT SIMULATION</text>
  </g>

  <!-- Project Caption Footer -->
  <rect x="0" y="420" width="750" height="80" fill="rgba(5, 3, 1, 0.9)"/>
  <line x1="0" y1="420" x2="750" y2="420" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1"/>
  <text x="40" y="462" font-family="'Syne', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">TRADING INTELLIGENCE</text>
  <text x="40" y="484" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#FCD34D" letter-spacing="1.5">QUANTITATIVE MARKET PIPELINE</text>
  <text x="710" y="468" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#F59E0B" text-anchor="end" letter-spacing="1">EXPLORE ↗</text>
</svg>
