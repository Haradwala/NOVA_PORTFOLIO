  <!-- Project Caption Footer -->
  <rect x="0" y="420" width="750" height="80" fill="rgba(9, 2, 6, 0.9)"/>
  <line x1="0" y1="420" x2="750" y2="420" stroke="rgba(236, 72, 153, 0.25)" stroke-width="1"/>
  <text x="40" y="462" font-family="'Syne', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">DEALERSHIP PLATFORM</text>
  <text x="40" y="484" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#F472B6" letter-spacing="1.5">AUTOMOTIVE SERVICE &amp; JOB CARDS</text>
  <text x="710" y="468" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#EC4899" text-anchor="end" letter-spacing="1">EXPLORE ↗</text>
</svg>
