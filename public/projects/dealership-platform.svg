<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500">
  <defs>
    <!-- Card Surface Gradient -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222330"/>
      <stop offset="100%" stop-color="#181822"/>
    </linearGradient>

    <!-- Visual Area Viewport Gradient -->
    <linearGradient id="visualBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261220"/>
      <stop offset="60%" stop-color="#1c0d18"/>
      <stop offset="100%" stop-color="#120810"/>
    </linearGradient>

    <!-- Ambient Pink Glow -->
    <radialGradient id="dealerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#BE185D" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#BE185D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── 1. Base Card Surface ── -->
  <rect width="750" height="500" rx="16" fill="url(#cardSurface)"/>
  <rect width="750" height="500" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5"/>

  <!-- ── 2. Upper Project Visual Area (~68% of card height) ── -->
  <g transform="translate(20, 20)">
    <!-- Visual Canvas Background -->
    <rect width="710" height="315" rx="10" fill="url(#visualBg)"/>
    <rect width="710" height="315" rx="10" fill="url(#dealerGlow)"/>
    <rect width="710" height="315" rx="10" fill="none" stroke="rgba(236, 72, 153, 0.22)" stroke-width="1"/>

    <!-- Subtle Automotive Grid -->
    <g stroke="rgba(236, 72, 153, 0.07)" stroke-width="1">
      <line x1="0" y1="80" x2="710" y2="80"/>
      <line x1="0" y1="160" x2="710" y2="160"/>
      <line x1="0" y1="240" x2="710" y2="240"/>
      <line x1="175" y1="0" x2="175" y2="315"/>
      <line x1="355" y1="0" x2="355" y2="315"/>
      <line x1="535" y1="0" x2="535" y2="315"/>
    </g>

    <!-- Visual Graphic: 4-Stage Automotive Job Card Pipeline -->
    <g transform="translate(35, 55)">
      <!-- Stage 1: Vehicle Inward Inspection -->
      <g transform="translate(0, 25)">
        <rect width="140" height="165" rx="7" fill="rgba(35, 15, 28, 0.75)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.2"/>
        <rect x="12" y="14" width="116" height="24" rx="4" fill="rgba(236, 72, 153, 0.2)"/>
        <text x="70" y="30" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10.5" font-weight="700" fill="#F472B6">01 · INWARD</text>
        <g transform="translate(15, 52)">
          <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">VIN Scan: OK</text>
          <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">Odo: 42,180km</text>
          <text x="0" y="50" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">Checklist: 18/18</text>
          <rect x="0" y="66" width="75" height="15" rx="2" fill="rgba(16, 185, 129, 0.25)"/>
          <text x="37" y="77" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34D399">LOGGED</text>
        </g>
      </g>

      <!-- Stage Transition 1 -->
      <g transform="translate(142, 107)">
        <line x1="0" y1="0" x2="22" y2="0" stroke="#EC4899" stroke-width="1.8" stroke-dasharray="3 3"/>
      </g>

      <!-- Stage 2: Technician Bay Allocation -->
      <g transform="translate(166, 25)">
        <rect width="140" height="165" rx="7" fill="rgba(35, 15, 28, 0.75)" stroke="rgba(236, 72, 153, 0.55)" stroke-width="1.2"/>
        <rect x="12" y="14" width="116" height="24" rx="4" fill="rgba(236, 72, 153, 0.25)"/>
        <text x="70" y="30" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10.5" font-weight="700" fill="#F472B6">02 · BAY ALLOC</text>
        <g transform="translate(15, 52)">
          <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">Bay #04 (Lift)</text>
          <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">Tech: Lead A</text>
          <text x="0" y="50" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">Timer: 01:24:10</text>
          <rect x="0" y="66" width="75" height="15" rx="2" fill="rgba(236, 72, 153, 0.3)"/>
          <text x="37" y="77" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FBCFE8">ACTIVE</text>
        </g>
      </g>

      <!-- Stage Transition 2 -->
      <g transform="translate(308, 107)">
        <line x1="0" y1="0" x2="22" y2="0" stroke="#EC4899" stroke-width="1.8" stroke-dasharray="3 3"/>
      </g>

      <!-- Stage 3: Inventory Parts Deduction -->
      <g transform="translate(332, 25)">
        <rect width="140" height="165" rx="7" fill="rgba(35, 15, 28, 0.75)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.2"/>
        <rect x="12" y="14" width="116" height="24" rx="4" fill="rgba(236, 72, 153, 0.2)"/>
        <text x="70" y="30" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10.5" font-weight="700" fill="#F472B6">03 · SPARES</text>
        <g transform="translate(15, 52)">
          <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">Brake Pads x2</text>
          <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">Oil Filter: 5W30</text>
          <text x="0" y="50" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">Ledger Sync</text>
          <rect x="0" y="66" width="75" height="15" rx="2" fill="rgba(16, 185, 129, 0.25)"/>
          <text x="37" y="77" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34D399">DEDUCTED</text>
        </g>
      </g>

      <!-- Stage Transition 3 -->
      <g transform="translate(474, 107)">
        <line x1="0" y1="0" x2="22" y2="0" stroke="#EC4899" stroke-width="1.8" stroke-dasharray="3 3"/>
      </g>

      <!-- Stage 4: Invoice QA & Delivery -->
      <g transform="translate(498, 25)">
        <rect width="140" height="165" rx="7" fill="rgba(35, 15, 28, 0.75)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.2"/>
        <rect x="12" y="14" width="116" height="24" rx="4" fill="rgba(236, 72, 153, 0.2)"/>
        <text x="70" y="30" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10.5" font-weight="700" fill="#F472B6">04 · BILLING</text>
        <g transform="translate(15, 52)">
          <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">Job Card Close</text>
          <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">Audit: Match</text>
          <text x="0" y="50" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.7)">GST Invoice</text>
          <rect x="0" y="66" width="85" height="15" rx="2" fill="rgba(16, 185, 129, 0.25)"/>
          <text x="42" y="77" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34D399">READY DELIV</text>
        </g>
      </g>
    </g>

    <!-- Header Status Badges -->
    <g transform="translate(24, 24)">
      <rect width="148" height="22" rx="4" fill="rgba(28, 12, 22, 0.8)" stroke="rgba(236, 72, 153, 0.35)" stroke-width="1"/>
      <circle cx="12" cy="11" r="3" fill="#EC4899"/>
      <text x="22" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FCE7F3" letter-spacing="1">OPS WORKFLOW</text>
    </g>

    <g transform="translate(565, 24)">
      <rect width="120" height="22" rx="4" fill="rgba(28, 12, 22, 0.8)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="60" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255, 255, 255, 0.6)" letter-spacing="1">REACT / FASTAPI</text>
    </g>
  </g>

  <!-- ── 3. Lower Card Typography (~32% of card height) ── -->
  <line x1="24" y1="352" x2="726" y2="352" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>

  <g transform="translate(32, 375)">
    <!-- Category Tag -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="5" r="3" fill="#EC4899"/>
      <text x="14" y="9" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#EC4899" letter-spacing="2">AUTOMOTIVE SYSTEMS · 2025</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="44" font-family="'Syne', system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">DEALERSHIP PLATFORM</text>

    <!-- One-line Descriptor -->
    <text x="0" y="74" font-family="'DM Sans', system-ui, sans-serif" font-size="15" fill="rgba(255, 255, 255, 0.62)">Automotive service operations platform managing real-time technician job cards</text>

    <!-- External Link Glyph -->
    <g transform="translate(650, 28)">
      <circle cx="16" cy="16" r="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="16" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">↗</text>
    </g>
  </g>
</svg>
