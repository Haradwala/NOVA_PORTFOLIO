<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500">
  <defs>
    <!-- Card Surface Gradient -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222330"/>
      <stop offset="100%" stop-color="#181822"/>
    </linearGradient>

    <!-- Visual Area Viewport Gradient -->
    <linearGradient id="visualBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f241a"/>
      <stop offset="60%" stop-color="#0b1b13"/>
      <stop offset="100%" stop-color="#07130d"/>
    </linearGradient>

    <!-- Ambient Emerald Glow -->
    <radialGradient id="agroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#047857" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── 1. Base Card Surface ── -->
  <rect width="750" height="500" rx="16" fill="url(#cardSurface)"/>
  <rect width="750" height="500" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5"/>

  <!-- ── 2. Upper Project Visual Area (~68% of card height) ── -->
  <g transform="translate(20, 20)">
    <!-- Visual Canvas Background -->
    <rect width="710" height="315" rx="10" fill="url(#visualBg)"/>
    <rect width="710" height="315" rx="10" fill="url(#agroGlow)"/>
    <rect width="710" height="315" rx="10" fill="none" stroke="rgba(16, 185, 129, 0.22)" stroke-width="1"/>

    <!-- Subtle Logistics Map Grid -->
    <g stroke="rgba(16, 185, 129, 0.07)" stroke-width="1">
      <line x1="0" y1="80" x2="710" y2="80"/>
      <line x1="0" y1="160" x2="710" y2="160"/>
      <line x1="0" y1="240" x2="710" y2="240"/>
      <line x1="180" y1="0" x2="180" y2="315"/>
      <line x1="355" y1="0" x2="355" y2="315"/>
      <line x1="530" y1="0" x2="530" y2="315"/>
    </g>

    <!-- Visual Graphic: Agricultural Procurement Hub & Logistics Network -->
    <g transform="translate(60, 50)">
      <!-- Hub 1: Regional Procurement Depot -->
      <g transform="translate(40, 40)">
        <circle r="36" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5"/>
        <circle r="24" fill="none" stroke="#6EE7B7" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="0" y="-4" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10" font-weight="700" fill="#A7F3D0">HUB A</text>
        <text x="0" y="10" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10B981">NORTH</text>
      </g>

      <!-- Hub 2: Central Wholesale Terminal (Main Hub) -->
      <g transform="translate(290, 110)">
        <circle r="52" fill="rgba(16, 185, 129, 0.22)" stroke="#10B981" stroke-width="2"/>
        <circle r="40" fill="none" stroke="#A7F3D0" stroke-width="1.2" stroke-dasharray="4 4"/>
        <circle r="18" fill="#10B981"/>
        <text x="0" y="-6" text-anchor="middle" font-family="'Syne', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">CENTRAL</text>
        <text x="0" y="8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#D1FAE5">DISPATCH</text>
        <text x="0" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6EE7B7">SYNCED</text>
      </g>

      <!-- Hub 3: South Agricultural Warehouse -->
      <g transform="translate(540, 50)">
        <circle r="36" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5"/>
        <circle r="24" fill="none" stroke="#6EE7B7" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="0" y="-4" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10" font-weight="700" fill="#A7F3D0">HUB B</text>
        <text x="0" y="10" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10B981">SOUTH</text>
      </g>

      <!-- Hub 4: Grain Processing Terminal -->
      <g transform="translate(100, 175)">
        <circle r="30" fill="rgba(16, 185, 129, 0.12)" stroke="#34D399" stroke-width="1.2"/>
        <text x="0" y="4" text-anchor="middle" font-family="'Syne', sans-serif" font-size="9" font-weight="700" fill="#A7F3D0">DEPOT 03</text>
      </g>

      <!-- Hub 5: Cold Storage Distribution -->
      <g transform="translate(480, 175)">
        <circle r="30" fill="rgba(16, 185, 129, 0.12)" stroke="#34D399" stroke-width="1.2"/>
        <text x="0" y="4" text-anchor="middle" font-family="'Syne', sans-serif" font-size="9" font-weight="700" fill="#A7F3D0">STORAGE</text>
      </g>

      <!-- Logistics Interconnecting Supply Route Lines -->
      <g stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8">
        <line x1="74" y1="48" x2="242" y2="98"/>
        <line x1="338" y1="98" x2="506" y2="58"/>
        <line x1="128" y1="165" x2="248" y2="128"/>
        <line x1="334" y1="128" x2="452" y2="165"/>
      </g>

      <!-- Real-time Batch Routing Packets -->
      <circle cx="158" cy="73" r="4.5" fill="#34D399"/>
      <circle cx="422" cy="78" r="4.5" fill="#34D399"/>
      <circle cx="188" cy="146" r="4" fill="#6EE7B7"/>
      <circle cx="393" cy="146" r="4" fill="#6EE7B7"/>
    </g>

    <!-- Header Status Badges -->
    <g transform="translate(24, 24)">
      <rect width="138" height="22" rx="4" fill="rgba(11, 24, 18, 0.8)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
      <circle cx="12" cy="11" r="3" fill="#10B981"/>
      <text x="22" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#D1FAE5" letter-spacing="1">DISTRIBUTED SYNC</text>
    </g>

    <g transform="translate(565, 24)">
      <rect width="120" height="22" rx="4" fill="rgba(11, 24, 18, 0.8)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="60" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255, 255, 255, 0.6)" letter-spacing="1">POSTGRES / DOCKER</text>
    </g>
  </g>

  <!-- ── 3. Lower Card Typography (~32% of card height) ── -->
  <line x1="24" y1="352" x2="726" y2="352" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>

  <g transform="translate(32, 375)">
    <!-- Category Tag -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="5" r="3" fill="#10B981"/>
      <text x="14" y="9" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#10B981" letter-spacing="2">AGRITECH &amp; LOGISTICS · 2025</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="44" font-family="'Syne', system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">MR AGRO</text>

    <!-- One-line Descriptor -->
    <text x="0" y="74" font-family="'DM Sans', system-ui, sans-serif" font-size="15" fill="rgba(255, 255, 255, 0.62)">Agricultural supply chain &amp; procurement logistics platform with offline sync</text>

    <!-- External Link Glyph -->
    <g transform="translate(650, 28)">
      <circle cx="16" cy="16" r="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="16" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">↗</text>
    </g>
  </g>
</svg>
