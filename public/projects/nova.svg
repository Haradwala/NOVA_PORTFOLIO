<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1238"/>
      <stop offset="60%" stop-color="#0e081c"/>
      <stop offset="100%" stop-color="#06040c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="750" height="500" fill="url(#bg)" rx="12"/>
  <rect width="750" height="500" fill="url(#glow)" rx="12"/>
  <rect x="1.5" y="1.5" width="747" height="497" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" rx="11"/>
  
  <!-- Neural Core Rings -->
  <g transform="translate(375, 230)">
    <circle r="72" fill="none" stroke="#8B5CF6" stroke-width="2.5" opacity="0.9"/>
    <ellipse rx="95" ry="46" fill="none" stroke="#A78BFA" stroke-width="1.8" transform="rotate(35)" opacity="0.75"/>
    <ellipse rx="95" ry="46" fill="none" stroke="#C4B5FD" stroke-width="1.2" transform="rotate(-35)" opacity="0.6"/>
    <circle r="12" fill="#8B5CF6"/>
    <circle r="5" fill="#FFFFFF"/>
  </g>

  <!-- Minimal Project Title Overlay -->
  <text x="40" y="445" font-family="'Instrument Sans', -apple-system, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="1">NOVA AI</text>
  <text x="40" y="470" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">LIVING AI OPERATING ENVIRONMENT</text>
</svg>
